name: Controller Organizer

on:
  push:
    branches: [refactor-controller-modules-20260927]
    paths: [.github/workflows/controller-organizer.yml]

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-controller-modules-20260927
          fetch-depth: 0
      - name: Organize Laravel controllers by domain
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('backend/app/Http/Controllers')
          mapping = {
              # Authentication and account
              'AuthController.php': 'Auth',
              'ProfileController.php': 'Account',
              'ProfileCenterController.php': 'Account',

              # AI and analytics
              'AiAssistantController.php': 'AI',
              'AiCreditSettingsController.php': 'AI',
              'BusinessControlController.php': 'Analytics',
              'BusinessPulseController.php': 'Analytics',
              'DashboardIntelligenceController.php': 'Analytics',

              # Billing
              'BillingCheckoutController.php': 'Billing',
              'BillingGrowthController.php': 'Billing',
              'BillingOverviewController.php': 'Billing',
              'BillingPlanController.php': 'Billing',
              'BillingWebhookController.php': 'Billing',

              # Finance
              'BankReconciliationController.php': 'Finance',
              'CashMovementController.php': 'Finance',
              'FinanceDocumentController.php': 'Finance',
              'FinanceImportController.php': 'Finance',
              'FinanceLookupController.php': 'Finance',
              'InvoiceAutomationController.php': 'Finance',
              'PaymentPlanController.php': 'Finance',
              'TaxComplianceController.php': 'Finance',

              # Inventory and production
              'InventoryIntelligenceController.php': 'Inventory',
              'InventoryOverviewController.php': 'Inventory',
              'InventoryTransferWorkflowController.php': 'Inventory',
              'ProductInventoryController.php': 'Inventory',
              'WarehouseController.php': 'Inventory',
              'WarehouseInventoryController.php': 'Inventory',
              'ProductionController.php': 'Production',
              'ProductionRecipeController.php': 'Production',
              'ProductionRunController.php': 'Production',

              # Parties / CRM
              'CustomerIntelligenceController.php': 'Parties',
              'PartyAccountController.php': 'Parties',
              'PartyBulkActionController.php': 'Parties',
              'PartyBulkEditController.php': 'Parties',
              'PartyController.php': 'Parties',
              'PartyDataTransferController.php': 'Parties',
              'PartyInsightsController.php': 'Parties',
              'PartyPermanentDeletionController.php': 'Parties',
              'PartyPricingController.php': 'Parties',

              # Products / catalog
              'ProductBulkActionController.php': 'Products',
              'ProductBulkEditController.php': 'Products',
              'ProductController.php': 'Products',
              'ProductDataTransferController.php': 'Products',
              'ProductInsightsController.php': 'Products',
              'ProductPermanentDeletionController.php': 'Products',

              # Staff
              'DepartmentController.php': 'Staff',
              'StaffController.php': 'Staff',
              'StaffCorrectionController.php': 'Staff',
              'StaffImportController.php': 'Staff',
              'StaffInvitationController.php': 'Staff',
              'StaffWorkforceController.php': 'Staff',

              # Workspace / organization
              'ActiveOrganizationController.php': 'Workspace',
              'MembershipController.php': 'Workspace',
              'OrganizationController.php': 'Workspace',
              'OwnershipTransferController.php': 'Workspace',
              'WorkspaceConversationController.php': 'Workspace',
              'WorkspaceConversationSettingsController.php': 'Workspace',
              'WorkspaceCustomizationController.php': 'Workspace',
              'WorkspaceMessageMemberController.php': 'Workspace',
              'WorkspaceNotificationController.php': 'Workspace',
              'WorkspaceRoleController.php': 'Workspace',
              'WorkspaceSettingsController.php': 'Workspace',

              # MCP
              'McpApprovalController.php': 'Mcp',
              'McpManagementController.php': 'Mcp',
              'McpOAuthConnectionController.php': 'Mcp',
              'McpProtocolController.php': 'Mcp',
              'McpTokenController.php': 'Mcp',

              # Platform administration
              'PlatformAdminController.php': 'Platform',
              'PlatformFeatureAdminController.php': 'Platform',

              # Reporting
              'ReportBuilderController.php': 'Reports',
              'ReportStudioController.php': 'Reports',
              'ScheduledReportController.php': 'Reports',

              # Governance / controls
              'ApprovalWorkflowController.php': 'Governance',
              'AuditCenterController.php': 'Governance',
              'BulkActionHistoryController.php': 'Governance',
              'NotificationRuleController.php': 'Governance',
              'RestoreCenterController.php': 'Governance',
              'SystemCheckController.php': 'Governance',

              # Focused modules
              'MarketingContactController.php': 'Marketing',
              'MarketingPageController.php': 'Marketing',
              'MarketingSolutionController.php': 'Marketing',
              'PurchaseRequisitionController.php': 'Procurement',
              'RecordCollaborationController.php': 'Collaboration',
              'DocumentFulfillmentController.php': 'Documents',
              'TaskManagementController.php': 'Tasks',
              'CommercialOperationsController.php': 'Operations',
              'ServiceOperationController.php': 'Operations',
          }

          old_to_new = {}
          moved = []
          for filename, domain in mapping.items():
              src = root / filename
              if not src.exists():
                  raise SystemExit(f'Missing expected controller: {src}')
              dst = root / domain / filename
              dst.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'mv', str(src), str(dst)], check=True)

              text = dst.read_text(encoding='utf-8')
              old_ns = 'namespace App\\Http\\Controllers;'
              new_ns = f'namespace App\\Http\\Controllers\\{domain};'
              if old_ns not in text:
                  raise SystemExit(f'Unexpected namespace in {dst}')
              text = text.replace(old_ns, new_ns, 1)
              if re.search(r'\bextends\s+Controller\b', text) and 'use App\\Http\\Controllers\\Controller;' not in text:
                  text = text.replace(new_ns, new_ns + '\n\nuse App\\Http\\Controllers\\Controller;', 1)
              dst.write_text(text, encoding='utf-8')

              cls = filename[:-4]
              old_to_new[f'App\\Http\\Controllers\\{cls}'] = f'App\\Http\\Controllers\\{domain}\\{cls}'
              moved.append((domain, cls))

          # Update every PHP reference in the application/tests/routes/config using the old FQCN.
          for path in Path('backend').rglob('*.php'):
              if any(part in {'vendor', 'node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in old_to_new.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          backup = root / 'TaskManagementController.php.bak'
          if backup.exists():
              subprocess.run(['git', 'rm', str(backup)], check=True)

          # Add a small map so future contributors immediately know the ownership model.
          domains = {}
          for domain, cls in moved:
              domains.setdefault(domain, []).append(cls)
          lines = [
              '# Controller modules',
              '',
              'Controllers are grouped by business/domain ownership. Keep `Controller.php` at the root as the shared base class.',
              'When adding a controller, place it in the closest domain folder and use the matching PSR-4 namespace.',
              '',
          ]
          for domain in sorted(domains):
              lines.append(f'- **{domain}** — ' + ', '.join(sorted(domains[domain])))
          lines += ['', 'Cross-domain controllers should only stay at the root when no single module owns them.', '']
          (root / 'README.md').write_text('\n'.join(lines), encoding='utf-8')

          # Guard against stale old fully-qualified references.
          stale = []
          for path in Path('backend').rglob('*'):
              if not path.is_file() or any(part in {'vendor', 'node_modules'} for part in path.parts):
                  continue
              if path.suffix not in {'.php', '.md', '.json', '.yml', '.yaml'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for old in old_to_new:
                  if old in text:
                      stale.append(f'{path}: {old}')
          if stale:
              raise SystemExit('Stale controller references remain:\n' + '\n'.join(stale))

          print(f'Organized {len(moved)} controllers across {len(domains)} domain folders.')
          PY

          git config user.name "mohmmaddwekat"
          git config user.email "57283690+mohmmaddwekat@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Organize controllers by domain"
          git push origin HEAD:refactor-controller-modules-20260927
