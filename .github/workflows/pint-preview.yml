name: Pint Preview

on:
  push:
    branches:
      - pint-format-preview-20260927

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - name: Apply Pint formatting in runner
        run: vendor/bin/pint

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app database routes tests
          git commit -m "Apply Pint formatting"
          git push origin HEAD:pint-format-preview-20260927
