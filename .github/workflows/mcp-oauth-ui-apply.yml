name: MCP OAuth UI Apply

on:
  push:
    branches:
      - mcp-oauth-bootstrap-20260927
    paths:
      - backend/scripts/apply_mcp_oauth_ui_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp-oauth-bootstrap-20260927
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply MCP OAuth UI patch
        run: python backend/scripts/apply_mcp_oauth_ui_patch.py
      - name: Commit generated UI changes
        run: |
          if git diff --quiet; then
            echo "No UI changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/resources/js/pages/Mcp/Index.tsx
          git commit -m "Add OAuth client connections to MCP Hub"
          git push
