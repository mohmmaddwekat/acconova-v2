name: Service Inventory

on:
  push:
    branches: [refactor-controller-modules-20260927]
    paths: [.github/workflows/service-inventory.yml]

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-controller-modules-20260927
      - name: Build inventory
        run: |
          {
            echo '# Root service files'
            find backend/app/Services -maxdepth 1 -type f -printf '%f\n' | sort
            echo
            echo '# Existing service directories'
            find backend/app/Services -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          } > backend/app/Services/SERVICE_INVENTORY.tmp
      - name: Commit inventory
        run: |
          git config user.name "mohmmaddwekat"
          git config user.email "57283690+mohmmaddwekat@users.noreply.github.com"
          git add backend/app/Services/SERVICE_INVENTORY.tmp
          git commit -m "Inventory root services"
          git push origin HEAD:refactor-controller-modules-20260927
