name: Controller Pint Cleanup

on:
  push:
    branches: [refactor-controller-modules-20260927]
    paths: [.github/workflows/controller-pint.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-controller-modules-20260927
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - working-directory: backend
        run: vendor/bin/pint app/Http/Controllers routes app/Support/TaskAccess.php
      - name: Commit formatter output
        run: |
          git config user.name "mohmmaddwekat"
          git config user.email "57283690+mohmmaddwekat@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Pint changes required."
            exit 0
          fi
          git commit -m "Format organized controllers"
          git push origin HEAD:refactor-controller-modules-20260927
