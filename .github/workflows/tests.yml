name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: acconova_test
          MYSQL_USER: acconova
          MYSQL_PASSWORD: local-development-only
          MYSQL_ROOT_PASSWORD: local-root-only
        ports: ["33069:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-root-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite
          coverage: none
      - name: Enable trigger migrations on the isolated test server
        run: docker exec ${{ job.services.mysql.id }} mysql -uroot -plocal-root-only -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Targeted finance workflow test
        run: php artisan test --filter=FinanceWorkflowTest
      - run: php artisan test
      - run: vendor/bin/phpunit --configuration=phpunit.sqlite.xml
      - run: vendor/bin/pint --test
