*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#dfeaf5;color:var(--text);display:flex;gap:32px;padding:24px;min-height:100vh;align-items:flex-start;justify-content:center}
aside{width:340px;background:#fff;border-radius:20px;border:1px solid var(--line);padding:16px;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;flex:none}

aside input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;margin-bottom:12px}
.g{font-size:12px;font-weight:800;color:var(--faint);margin:14px 0 6px}
.it{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600}
.it:hover{background:var(--bg-soft)}.it.on{background:var(--accent);color:#fff}
.it small{margin-inline-start:auto;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}

.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.route{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;direction:ltr}
.phone{width:375px;height:780px;background:var(--bg);border-radius:44px;border:10px solid #0b1b2b;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(1,28,50,.25)}
.status{height:28px;background:var(--surface);flex:none}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex:none;gap:12px}
.top b{font-size:18px;font-weight:800}.top small{display:block;color:var(--muted);font-size:13px}
.back{width:44px;height:44px;border-radius:22px;background:var(--bg-soft);display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}
.circ{width:44px;height:44px;border-radius:22px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.scroll{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}

.hero:before{content:"";position:absolute;top:-48px;right:-48px;width:160px;height:160px;border-radius:50%;background:#fff;opacity:.12}
.hero .l{font-size:14px;opacity:.85;font-weight:600}.hero .v{font-size:32px;font-weight:800}.hero .s{font-size:14px;opacity:.85}
.trend{align-self:flex-start;background:rgba(255,255,255,.18);border-radius:12px;padding:4px 12px;font-size:12px;font-weight:700}
.split{display:flex;margin-top:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
.split div{flex:1}.split div+div{border-right:1px solid rgba(255,255,255,.2);padding-right:16px}

h3{font-size:15px;font-weight:800;color:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 2px 16px rgba(1,28,50,.05);flex:none}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;margin-bottom:8px;flex:none}
.big{font-size:22px;font-weight:800}.lab{font-size:14px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:12px;height:96px;margin:12px 0 4px}

.form{margin:-40px 16px 0;background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(4,84,149,.15);position:relative}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.field div{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--faint);font-size:14px}

.act{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 4px;text-align:center;font-size:13px;font-weight:700;color:var(--soft);cursor:pointer}

.hub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.hub .act{padding:12px 4px;font-size:12px;border-radius:16px}.hub .act span{width:40px;height:40px;font-size:18px;margin-bottom:6px}

function badge(t,tone){return t?`<span class="badge ${tone||'info'}">${t}</span>`:''}
function stat(s){const bg={ok:'var(--okbg)',warn:'var(--warnbg)',bad:'var(--badbg)',info:'var(--bg-soft)'}[s[3]];return `<div class="card"><div class="ic" style="background:${bg}">${s[0]}</div><div class="big">${s[1]}</div><div class="lab">${s[2]}</div></div>`}

function tabs(active){const T=[['home','🏠','الرئيسية'],['sales','📄','الفواتير'],['__add','+',''],['appr','✅','موافقات'],['hub','⋯','المزيد']];
 return `<div class="tabs">${T.map(t=>t[0]==='__add'?`<div class="fab" onclick="go('quick')">+</div>`:`<div class="${active===t[0]?'on':''}" onclick="go('${t[0]}',true)"><em>${t[1]}</em>${t[2]}</div>`).join('')}</div>`}

function moduleScreen(m){
 const withBack = hist.length>0;
 return `<div class="top">${withBack?`<div class="back" onclick="back()">→</div>`:''}<div style="flex:1"><b>${m.t}</b></div><div class="circ">${m.cta&&m.cta.startsWith('+')?'+':'⋮'}</div></div>
 <div class="scroll">
  <div class="hero"><span class="l">${m.hero[0]}</span><span class="v">${m.hero[1]}</span><span class="s">${m.hero[2]}</span></div>
  <div class="grid2">${m.stats.map(stat).join('')}</div>
  <div class="search">🔍 بحث في ${m.t}…</div>
  <div class="pills">${m.pills.map((p,i)=>`<div class="pill ${i==0?'on':''}">${p}</div>`).join('')}</div>
  ${m.rows.map(r=>`<div class="card row"><div class="m"><b>${r[0]}</b><small>${r[1]}</small></div><div class="s">${r[2]?`<b>${r[2]}</b>`:''}${badge(r[3],r[4])}</div></div>`).join('')}
  ${m.cta?`<div class="cta">${m.cta}</div>`:''}
 </div>${tabs(m.k==='sales'?'sales':m.k==='appr'?'appr':'')}`}

function home(){return `<div class="top"><div><b>مرحباً، محمد</b><small>الأربعاء، 4 نوفمبر</small></div><div class="back" onclick="go('notif')">🔔</div></div>
<div class="scroll">
 <div class="hero"><span class="l">صافي هذا الشهر</span><span class="v">48,250 ₪</span><span class="trend">↗ 12% في الإيرادات عن الشهر السابق</span>
 <div class="split"><div><small>الإيرادات</small><b>91,400 ₪</b></div><div><small>المصاريف</small><b>43,150 ₪</b></div></div></div>
 <h3>تحتاج انتباهك</h3>
 <div class="grid2"><div class="card" onclick="go('follow')" style="cursor:pointer"><div class="ic" style="background:var(--badbg)">📞</div><div class="big">8</div><div class="lab">عملاء للمتابعة</div></div>
 <div class="card" onclick="go('anom')" style="cursor:pointer"><div class="ic" style="background:var(--warnbg)">🚨</div><div class="big">5</div><div class="lab">عمليات غير معتادة</div></div>
 <div class="card" onclick="go('appr')" style="cursor:pointer"><div class="ic" style="background:var(--bg-soft)">✅</div><div class="big">6</div><div class="lab">موافقات</div></div>
 <div class="card" onclick="go('tasks')" style="cursor:pointer"><div class="ic" style="background:var(--bg-soft)">📋</div><div class="big">9</div><div class="lab">مهام اليوم</div></div></div>
 <div class="grid2"><div class="card"><div class="ic" style="background:#E6F3FE">💳</div><div class="big">27,900 ₪</div><div class="lab">مستحق لنا</div></div><div class="card"><div class="ic" style="background:var(--warnbg)">⏱</div><div class="big">14,300 ₪</div><div class="lab">مستحق علينا</div></div></div>
 <div class="card"><b>الإيرادات والمصاريف</b><div class="chart"><div><i style="height:55%"></i><i style="height:35%"></i></div><div><i style="height:62%"></i><i style="height:40%"></i></div><div><i style="height:48%"></i><i style="height:45%"></i></div><div><i style="height:75%"></i><i style="height:38%"></i></div><div><i style="height:70%"></i><i style="height:50%"></i></div><div><i style="height:92%"></i><i style="height:44%"></i></div></div></div>
 <h3>إجراءات سريعة</h3>
 <div class="acts">${[['newinv','📄','فاتورة بيع','#E6F3FE'],['purch','🧾','فاتورة شراء','var(--warnbg)'],['receipt','💵','قبض','var(--okbg)'],['pay','💸','دفع','var(--badbg)'],['req','🛒','طلب شراء','#E6F3FE'],['tasks','📋','مهمة','#E6F3FE']].map(a=>`<div class="act" onclick="go('${a[0]}')"><span style="background:${a[3]}">${a[1]}</span>${a[2]}</div>`).join('')}</div>
</div>${tabs('home')}`}

function hub(){
 const groups=[...new Set(M.map(m=>m.g))];
 return `<div class="top"><b>المزيد</b><div class="back" onclick="go('login')">⎋</div></div><div class="scroll">
 <div class="prof"><div class="av">م</div><div><b style="font-size:18px">محمد الدويكات</b><div style="font-size:13px;opacity:.85;margin-top:2px">شركة النور القابضة ▾</div></div></div>
 <div class="seg"><div>تلقائي</div><div class="on">فاتح</div><div>داكن</div></div>
 ${groups.map(g=>`<h3>${g}</h3><div class="hub">${M.filter(m=>m.g===g).map(m=>`<div class="act" onclick="go('${m.k}')"><span style="background:var(--bg-soft)">${m.i}</span>${m.t}</div>`).join('')}</div>`).join('')}
 </div>${tabs('hub')}`}

function login(){return `<div class="login-hero"><div class="logo">AN</div><b style="font-size:28px">AccoNova</b><span style="opacity:.85;font-size:14px">نظام المحاسبة الذكي</span></div>
<div class="form"><div><b style="font-size:22px">أهلاً بعودتك</b><div style="color:var(--muted);font-size:14px;margin-top:4px">سجّل الدخول لمتابعة أعمالك</div></div>
<div class="field"><label>البريد الإلكتروني</label><div>name@company.com</div></div><div class="field"><label>كلمة المرور</label><div>••••••••</div></div>
<div class="cta" style="cursor:pointer" onclick="go('home',true)">تسجيل الدخول</div></div>`}

function render(){
 const m=M.find(x=>x.k===cur);
 $('#screen').innerHTML = cur==='home'?home():cur==='hub'?hub():cur==='login'?login():moduleScreen(m);
 $('#route').textContent = m? m.route : cur==='home'?'/app/dashboard':cur==='hub'?'/app (more)':'/login';
 document.querySelectorAll('.it').forEach(e=>e.classList.toggle('on',e.dataset.k===cur));
}
function go(k,root){ if(root){hist=[]} else if(cur!==k){hist.push(cur)} cur=k; render(); }
function back(){ cur=hist.pop()||'home'; render(); }

function buildCatalog(){
 const q=$('#q').value.trim();
 let html='';
 html+=`<div class="g">البداية</div><div class="it" data-k="login" onclick="go('login',true)">🔑 تسجيل الدخول</div><div class="it" data-k="home" onclick="go('home',true)">🏠 الرئيسية</div><div class="it" data-k="hub" onclick="go('hub',true)">⋯ المزيد (كل الوحدات)</div>`;
 [...new Set(M.map(m=>m.g))].forEach(g=>{
  const items=M.filter(m=>m.g===g&&(!q||m.t.includes(q)));
  if(!items.length)return;
  html+=`<div class="g">${g}</div>`+items.map(m=>`<div class="it" data-k="${m.k}" onclick="go('${m.k}',true)">${m.i} ${m.t}<small class="${m.kind==='have'?'t-have':'t-new'}">${m.kind==='have'?'موجود':'جديد'}</small></div>`).join('');
 });
 $('#catalog').innerHTML=html; document.querySelectorAll('.it').forEach(e=>e.classList.toggle('on',e.dataset.k===cur));
}
$('#q').addEventListener('input',buildCatalog);
buildCatalog(); go('home',true);
</script>
</body>
</html>
