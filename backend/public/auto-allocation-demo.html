<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توزيع المقبوضات والدفعات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f7f6;--s1:#eceeed;--s2:#ffffff;--fg:#1b2220;--mut:#5d6866;--bd:#d9dedc;--bd2:#b9c2bf;
  --acc:#1b5e63;--acc-bg:#dcecec;--acc-fg:#134246;
  --ok-bg:#dff1e3;--ok-fg:#1d5a2e;--wn-bg:#fbefd0;--wn-fg:#7a5410;--er-bg:#f9dedb;--er-fg:#8a2a22;
  --pri-bg:#1b2220;--pri-fg:#ffffff;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a19;--s1:#1d2423;--s2:#222b2a;--fg:#e8eeec;--mut:#9aa6a3;--bd:#33403e;--bd2:#4a5a57;
  --acc:#6fc0c6;--acc-bg:#1f3a3c;--acc-fg:#a8e0e4;
  --ok-bg:#1d3a27;--ok-fg:#9ad8ae;--wn-bg:#413319;--wn-fg:#efcb82;--er-bg:#472624;--er-fg:#f2a8a1;
  --pri-bg:#e8eeec;--pri-fg:#141a19;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19;--s1:#1d2423;--s2:#222b2a;--fg:#e8eeec;--mut:#9aa6a3;--bd:#33403e;--bd2:#4a5a57;
  --acc:#6fc0c6;--acc-bg:#1f3a3c;--acc-fg:#a8e0e4;
  --ok-bg:#1d3a27;--ok-fg:#9ad8ae;--wn-bg:#413319;--wn-fg:#efcb82;--er-bg:#472624;--er-fg:#f2a8a1;
  --pri-bg:#e8eeec;--pri-fg:#141a19;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.6;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 2px;text-wrap:balance}
.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
button{font-family:inherit;font-size:13px;color:var(--fg);background:var(--s2);border:1px solid var(--bd2);border-radius:8px;padding:6px 14px;cursor:pointer}
button:hover{background:var(--s1)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--pri-bg);color:var(--pri-fg);border-color:var(--pri-bg)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px;flex:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden;background:var(--s2)}
.seg button{border:0;border-radius:0;background:transparent;border-inline-start:1px solid var(--bd);padding:6px 14px}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--acc-bg);color:var(--acc-fg);font-weight:500}
#msg{font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:10px;background:var(--acc-bg);color:var(--acc-fg)}
.box{background:var(--s2);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.ch{padding:9px 12px;font-size:13px;font-weight:500;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px}
.r{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bd);font-size:13px}
.r:last-child{border-bottom:0}
.r>div{min-width:0}
.m{color:var(--mut);font-size:12px}
.bd{font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.ok{background:var(--ok-bg);color:var(--ok-fg)}.wn{background:var(--wn-bg);color:var(--wn-fg)}
.er{background:var(--er-bg);color:var(--er-fg)}.nu{background:var(--s1);color:var(--mut)}.ac{background:var(--acc-bg);color:var(--acc-fg)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:640px){.g2{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{font-weight:500;text-align:right;padding:8px 10px;background:var(--s1);color:var(--mut);font-size:12px}
td{padding:8px 10px;border-bottom:1px solid var(--bd)}
tr.sub td{background:var(--s1);font-size:12px}
.cd{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ln{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px;flex-wrap:wrap}
.ln .nm{width:150px;flex:none}.ln .tr{flex:1;min-width:80px;height:6px;border-radius:3px;background:var(--s1);overflow:hidden}
.ln .tr i{display:block;height:100%;background:var(--ok-fg)}.ln .am{width:90px;text-align:left;flex:none}
.tl{border-inline-start:2px solid var(--bd2);margin:8px 8px 0 0;padding-inline-start:18px}
.ev{position:relative;font-size:13px;padding:3px 0 9px}
.ev:before{content:"";position:absolute;inset-inline-start:-24px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--ok-fg)}
.ev.p:before{background:var(--acc)}
#foot{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;background:var(--s1);border-radius:10px;font-size:13px;flex-wrap:wrap}
.lab{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
.lab label{display:flex;gap:6px;align-items:center;margin-top:6px;color:var(--mut);font-size:12px}
.selall{margin-bottom:10px}.selall label{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:500;cursor:pointer;padding:6px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:8px}
.demo{font-size:12px;color:var(--mut);margin-top:16px}
</style>
<div class="wrap" dir="rtl" id="r">
  <h1>توزيع المقبوضات والدفعات</h1>
  <p class="sub">ديمو تفاعلي بأربعة تصاميم لصفحة غير موزع. البيانات وهمية، والتوزيع فعلي: من تاريخ الدفعة ثم الأقدم.</p>
  <div class="bar">
    <div class="seg" id="modes"></div>
    <div class="seg" id="tabs" style="margin-inline-start:auto"></div>
  </div>
  <div id="msg"></div>
  <div class="selall"><label for="all"><input type="checkbox" id="all"> <span id="alltxt"></span></label></div>
  <div id="view"></div>
  <div id="foot"></div>
  <div class="lab">
    <div class="m" style="margin-bottom:8px">جرّب الحالات الحساسة بعد التوزيع</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap" id="edge"></div>
    <label for="cont"><input type="checkbox" id="cont"> بعد استنفاد الأقدم، كمّل على الفواتير الأحدث</label>
    <label for="unl"><input type="checkbox" id="unl"> أرشفة فاتورة موزعة: فك الربط تلقائياً (الافتراضي: منع)</label>
  </div>
  <p class="demo">لا يتصل هذا الديمو بقاعدة بياناتك. هو للمعاينة واختيار التصميم فقط.</p>
</div>
<script>
(function(){
const f=n=>Math.round(n).toLocaleString('en');
const dt=d=>d.split('-').reverse().join('/');
const sum=a=>a.reduce((s,x)=>s+x.amt,0);
let S;
function init(){S={mode:1,tab:'all',cont:false,unl:false,step:1,batch:0,hist:[],msg:'اختر حركات ثم اضغط توزيع تلقائي. التوزيع يبدأ من تاريخ الدفعة ثم يرجع للأقدم.',sel:new Set(),
mv:[{id:'RC-0412',p:'شركة النور',k:'sale',d:'2024-02-10',amt:1000,al:[]},{id:'RC-0398',p:'مؤسسة الأفق',k:'sale',d:'2024-02-03',amt:2500,al:[]},{id:'RC-0377',p:'شركة النور',k:'sale',d:'2024-01-28',amt:400,al:[]},{id:'PY-0221',p:'مورد الشرق',k:'purchase',d:'2024-02-05',amt:3000,al:[]},{id:'RC-0301',p:'',k:'sale',d:'2024-01-02',amt:700,al:[]}],
inv:[{id:'INV-2210',p:'شركة النور',k:'sale',d:'2024-02-10',t:500},{id:'INV-2198',p:'شركة النور',k:'sale',d:'2024-02-09',t:300},{id:'INV-2175',p:'شركة النور',k:'sale',d:'2024-02-08',t:400},{id:'INV-2101',p:'شركة النور',k:'sale',d:'2024-01-25',t:900},{id:'INV-2260',p:'مؤسسة الأفق',k:'sale',d:'2024-02-01',t:1800},{id:'INV-2240',p:'مؤسسة الأفق',k:'sale',d:'2024-01-20',t:1200},{id:'PO-118',p:'مورد الشرق',k:'purchase',d:'2024-02-04',t:1400},{id:'PO-102',p:'مورد الشرق',k:'purchase',d:'2024-01-20',t:1000}]};
S.mv.forEach(m=>{if(m.p)S.sel.add(m.id)})}
init();
const un=m=>m.amt-sum(m.al);
const paid=id=>S.mv.reduce((s,m)=>s+m.al.filter(a=>a.inv===id).reduce((q,a)=>q+a.amt,0),0);
const tabOk=x=>S.tab==='all'||x.k===S.tab;
const vis=()=>S.mv.filter(m=>tabOk(m)&&un(m)>0.0001);
const kb=m=>m.k==='sale'?'<span class="bd ok">قبض</span>':'<span class="bd ac">دفع</span>';
const lbl=m=>m.id+' · '+(m.p||'بدون طرف');
function sim(){
 const bal={};S.inv.forEach(i=>bal[i.id]=i.arch?0:i.t-paid(i.id));
 const ids=new Set(vis().map(m=>m.id));
 return S.mv.filter(m=>ids.has(m.id)&&S.sel.has(m.id)).sort((a,b)=>a.d<b.d?-1:1).map(m=>{
  const r={m,lines:[],left:un(m),warn:''};
  if(!m.p){r.warn='حدد الطرف أولاً';return r}
  const c=S.inv.filter(i=>i.p===m.p&&i.k===m.k&&bal[i.id]>0.0001);
  const b=c.filter(i=>i.d<=m.d).sort((a,b)=>a.d<b.d?1:-1);
  const a=S.cont?c.filter(i=>i.d>m.d).sort((a,b)=>a.d<b.d?-1:1):[];
  b.concat(a).forEach(i=>{if(r.left<=0.0001)return;const bl=bal[i.id],x=Math.min(r.left,bl);r.lines.push({i,x,full:x===bl});bal[i.id]-=x;r.left-=x});
  if(!c.length)r.warn='لا فواتير مفتوحة';else if(r.left>0.0001)r.warn='يبقى '+f(r.left)+' رصيد مقدم';
  return r})}
const chk=m=>`<input type="checkbox" aria-label="${m.id}" data-sel="${m.id}" ${S.sel.has(m.id)?'checked':''}>`;
const lineTxt=l=>`${l.i.id} (${dt(l.i.d)}) ← ${f(l.x)}${l.full?'':' من '+f(l.i.t)}`;
const warnB=r=>r.warn?`<span class="bd ${r.warn.startsWith('يبقى')?'wn':'er'}">${r.warn}</span>`:`<span class="bd ok">جاهز</span>`;
const empty='<div class="r m">لا توجد حركات غير موزعة هنا</div>';
function d1(pl){
 const L=vis().map(m=>`<div class="r">${chk(m)}<div style="flex:1"><div>${lbl(m)}</div><div class="m">${dt(m.d)} · غير موزع ${f(un(m))}</div></div><strong>${f(m.amt)}</strong></div>`).join('')||empty;
 const map={};pl.forEach(r=>r.lines.forEach(l=>(map[l.i.id]=map[l.i.id]||[]).push(r.m.id+' ← '+f(l.x))));
 const R=S.inv.filter(i=>!i.arch&&tabOk(i)&&i.t-paid(i.id)>0.0001).sort((a,b)=>a.p<b.p?-1:a.p>b.p?1:a.d<b.d?1:-1).map(i=>`<div class="r"><div style="flex:1"><div>${i.id} · ${dt(i.d)} · ${f(i.t-paid(i.id))}</div><div class="m">${i.p}</div></div>${map[i.id]?`<span class="bd ok">${map[i.id].join(' + ')}</span>`:'<span class="bd nu">بدون</span>'}</div>`).join('')||empty;
 return `<div class="g2"><div class="box"><div class="ch"><span>حركات غير موزعة</span></div>${L}</div><div class="box"><div class="ch"><span>فواتير مفتوحة (المقترح)</span></div>${R}</div></div>`}
function d2(pl){
 const by={};pl.forEach(r=>by[r.m.id]=r);
 const rows=vis().map(m=>{const r=by[m.id];
  const s=r?warnB(r):'<span class="bd nu">غير محدد</span>';
  const sub=r&&r.lines.length?`<tr class="sub"><td></td><td colspan="5">${r.lines.map(lineTxt).join(' &nbsp;|&nbsp; ')}${r.left>0.0001?' &nbsp;|&nbsp; الباقي '+f(r.left)+' رصيد مقدم':''}</td></tr>`:'';
  return `<tr><td>${chk(m)}</td><td>${m.id} ${kb(m)}</td><td>${m.p||'—'}</td><td>${dt(m.d)}</td><td>${f(un(m))}</td><td>${s}</td></tr>${sub}`}).join('');
 return `<div class="box scroll"><table><tr><th></th><th>الحركة</th><th>الطرف</th><th>التاريخ</th><th>غير موزع</th><th>الحالة</th></tr>${rows||'<tr><td colspan="6" class="m">لا توجد حركات</td></tr>'}</table></div>`}
function d3(pl){
 const by={};pl.forEach(r=>by[r.m.id]=r);const g={};vis().forEach(m=>(g[m.p||'بدون طرف']=g[m.p||'بدون طرف']||[]).push(m));
 return Object.keys(g).map(p=>{const ms=g[p];const tot=ms.reduce((s,m)=>s+un(m),0);const on=ms.every(m=>S.sel.has(m.id));
  const body=ms.map(m=>{const r=by[m.id];if(!r)return `<div class="m" style="padding:3px 0">${m.id}: غير محدد</div>`;
   return `<div style="padding:4px 0;font-size:13px"><span class="m">${m.id} · ${dt(m.d)} · ${f(un(m))}</span> ${warnB(r)}${r.lines.map(l=>`<div class="ln"><span class="nm">${l.i.id} · ${dt(l.i.d)}</span><div class="tr"><i style="width:${Math.round(l.x/l.i.t*100)}%"></i></div><span class="am">${f(l.x)} / ${f(l.i.t)}</span></div>`).join('')}</div>`}).join('');
  return `<div class="cd"><div style="display:flex;align-items:center;gap:10px"><input type="checkbox" aria-label="${p}" data-selp="${p}" ${on?'checked':''}><div style="flex:1"><div style="font-weight:500">${p} ${kb(ms[0])}</div><div class="m">غير موزع ${f(tot)}</div></div><button class="pri" data-ap="${p}">وزّع</button></div><div style="margin-top:6px;border-top:1px solid var(--bd);padding-top:4px">${body}</div></div>`}).join('')||'<div class="box">'+empty+'</div>'}
function d4(pl){
 if(S.step===1)return `<div class="box"><div class="ch"><span>1. اختر الحركات</span><span class="m">ثم اضغط معاينة</span></div>${vis().map(m=>`<div class="r">${chk(m)}<div style="flex:1">${lbl(m)} ${kb(m)}<div class="m">${dt(m.d)}</div></div><strong>${f(un(m))}</strong></div>`).join('')||empty}</div>`;
 return `<div class="box" style="padding:12px 14px"><div style="font-weight:500;margin-bottom:6px">2. معاينة التوزيع</div>${pl.map(r=>`<div style="margin-bottom:10px"><div style="font-size:13px"><strong>${r.m.id}</strong> · ${r.m.p||'بدون طرف'} ${warnB(r)}</div><div class="tl"><div class="ev p"><strong>${dt(r.m.d)}</strong> · ${r.m.k==='sale'?'مقبوض':'مدفوع'} ${f(un(r.m))}</div>${r.lines.map(l=>`<div class="ev"><strong>${dt(l.i.d)}</strong> · ${l.i.id} · ${f(l.x)} ${l.full?'<span class="bd ok">كاملة</span>':'<span class="bd wn">جزئية</span>'}</div>`).join('')}</div></div>`).join('')||'<div class="m">لا شيء محدد</div>'}</div>`}
function render(){
 const pl=sim();const act=pl.filter(r=>r.lines.length);
 document.getElementById('modes').innerHTML=['1 مقسوم','2 جدول','3 بطاقات','4 معالج'].map((t,i)=>`<button class="${S.mode===i+1?'on':''}" data-mode="${i+1}">${t}</button>`).join('');
 document.getElementById('tabs').innerHTML=[['all','الكل'],['sale','مبيعات'],['purchase','مشتريات']].map(x=>`<button class="${S.tab===x[0]?'on':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');
 document.getElementById('msg').textContent=S.msg;
 const vv=vis(),nn=vv.filter(m=>S.sel.has(m.id)).length,al=document.getElementById('all');
 al.checked=vv.length>0&&nn===vv.length;al.indeterminate=nn>0&&nn<vv.length;
 document.getElementById('alltxt').textContent='تحديد الكل ('+vv.length+') · المحدد '+nn;
 document.getElementById('view').innerHTML=[d1,d2,d3,d4][S.mode-1](pl);
 const tot=act.reduce((s,r)=>s+r.lines.reduce((q,l)=>q+l.x,0),0),nf=new Set();act.forEach(r=>r.lines.forEach(l=>nf.add(l.i.id)));
 const adv=pl.filter(r=>r.m.p).reduce((s,r)=>s+r.left,0);
 let btn;
 if(S.mode===4&&S.step===1)btn='<button class="pri" data-a="prev">معاينة</button>';
 else if(S.mode===4)btn='<button data-a="back">رجوع</button><button class="pri" data-a="apply">تأكيد وتنفيذ</button>';
 else btn='<button class="pri" data-a="apply">توزيع تلقائي للمحدد</button>';
 document.getElementById('foot').innerHTML=`<span>${pl.length} محددة · موزع ${f(tot)} على ${nf.size} فواتير · رصيد مقدم ${f(adv)}</span><span style="margin-inline-start:auto"></span><button data-a="undo" ${S.hist.length?'':'style="opacity:.5"'}>تراجع عن آخر توزيع</button>${btn}`;
 document.getElementById('edge').innerHTML=['delete|حذف RC-0412','edit|تعديل RC-0412 إلى 600','arch|أرشفة INV-2198','reset|إعادة الديمو'].map(x=>{const p=x.split('|');return `<button data-e="${p[0]}">${p[1]}</button>`}).join('');
 document.getElementById('cont').checked=S.cont;document.getElementById('unl').checked=S.unl}
function apply(only){
 const pl=sim().filter(r=>r.lines.length&&(only===undefined||r.m.p===only));
 if(!pl.length){S.msg='لا يوجد ما يمكن توزيعه ضمن المحدد.';return}
 S.batch++;let n=0;pl.forEach(r=>r.lines.forEach(l=>{r.m.al.push({inv:l.i.id,amt:l.x,b:S.batch});n++}));
 S.hist.push(S.batch);S.step=1;S.msg='تم التوزيع: '+n+' ربط على '+pl.length+' حركات. يمكنك التراجع أو تجربة الحالات الحساسة.'}
function edge(k){
 const m=S.mv.find(x=>x.id==='RC-0412'),i=S.inv.find(x=>x.id==='INV-2198');
 if(k==='reset'){init();return}
 if(k==='delete'){if(!m){S.msg='RC-0412 محذوفة مسبقاً.';return}const n=m.al.length;S.mv=S.mv.filter(x=>x!==m);S.sel.delete(m.id);S.msg='حُذفت RC-0412 وفُكّ ربط '+n+' فواتير تلقائياً، وعادت للحالة المفتوحة أو الجزئية.'}
 if(k==='edit'){if(!m){S.msg='RC-0412 غير موجودة.';return}m.amt=600;let ex=sum(m.al)-600,cut=0;while(ex>0.0001&&m.al.length){const a=m.al[m.al.length-1];const t=Math.min(a.amt,ex);a.amt-=t;ex-=t;cut+=t;if(a.amt<=0.0001)m.al.pop()}S.msg='عُدّل مبلغ RC-0412 إلى 600'+(cut?'، وخُفّض التوزيع بمقدار '+f(cut)+' من آخر الفواتير الموزعة (الأقدم يبقى).':'، ولم يتأثر أي توزيع.')}
 if(k==='arch'){if(!i||i.arch){S.msg='INV-2198 مؤرشفة أو غير موجودة.';return}const has=paid(i.id)>0;if(has&&!S.unl){S.msg='مرفوض: INV-2198 عليها توزيعات. فك الربط أولاً أو فعّل خيار الفك التلقائي.';return}S.mv.forEach(x=>x.al=x.al.filter(a=>a.inv!==i.id));i.arch=true;S.msg='أُرشفت INV-2198'+(has?' وفُك ربطها وعاد المبلغ غير موزع للحركة.':'.')}}
const root=document.getElementById('r');
root.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.mode){S.mode=+t.dataset.mode;S.step=1}
 else if(t.dataset.tab)S.tab=t.dataset.tab;
 else if(t.dataset.a==='apply')apply();
 else if(t.dataset.ap)apply(t.dataset.ap==='بدون طرف'?'':t.dataset.ap);
 else if(t.dataset.a==='prev'){S.step=2}
 else if(t.dataset.a==='back'){S.step=1}
 else if(t.dataset.a==='undo'){const b=S.hist.pop();if(b){S.mv.forEach(m=>m.al=m.al.filter(a=>a.b!==b));S.msg='تم التراجع عن آخر دفعة توزيع كاملة.'}}
 else if(t.dataset.e)edge(t.dataset.e);
 render()});
root.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.sel){t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel)}
 else if(t.dataset.selp){S.mv.filter(m=>(m.p||'بدون طرف')===t.dataset.selp).forEach(m=>t.checked?S.sel.add(m.id):S.sel.delete(m.id))}
 else if(t.id==='all'){vis().forEach(m=>t.checked?S.sel.add(m.id):S.sel.delete(m.id))}
 else if(t.id==='cont')S.cont=t.checked;
 else if(t.id==='unl')S.unl=t.checked;
 render()});
render();
})();
</script>
